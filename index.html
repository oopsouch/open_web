function linkifyPlace(place) {
  if (!place) return '';
  const cleanPlace = place.trim();
  
  // 링크를 걸지 않아야 할 일반 장소 (전시장, 회의실, 지역명 등) 예외 처리
  if (/미정|전시홀|그랜드\s*볼룸|사무실|광양|포항|서울|투어|[0-9]+호|미기재/.test(cleanPlace)) {
    return esc(cleanPlace);
  }

  let url = '';
  // 1. 사전 정의된 링크(placeLinks)에서 일치 또는 포함 여부 확인
  for (const [key, val] of Object.entries(placeLinks)) {
    if (cleanPlace.includes(key) || key.includes(cleanPlace)) {
      url = val;
      break;
    }
  }

  // 2. 사전에 없는 식당인 경우(예: 테라송) 네이버 지도 자동 검색 링크 연결 (Fallback)
  if (!url) {
    url = `https://map.naver.com/p/search/${encodeURIComponent('송도 ' + cleanPlace)}`;
  }

  return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:var(--blue);text-decoration:underline;">${esc(cleanPlace)}</a>`;
}

 tabs.querySelectorAll('.schedule-tab').forEach(button=>button.onclick=()=>{activeManagerScheduleType=button.dataset.kind;renderManagerSchedule()});
 const rows=activeManagerScheduleType==='모든일정'?entries:entries.filter(entry=>entry.category===activeManagerScheduleType);
 $('#managerScheduleResultCount').textContent=`${rows.length}건`;
 $('#managerScheduleRows').innerHTML=rows.length?rows.map((entry,index)=>{const activity=displayActivity(entry,entry.category),place=entry.place&&!activity.includes(entry.place)?entry.place:'',scheduleText=esc(activity)+(place?'('+linkifyPlace(place)+')':''),attendees=formatAttendeeRows(entry.attendees)||'—';return `<tr class="manager-schedule-row" data-entry-index="${index}" tabindex="0" role="button" aria-label="일정 세부 정보 보기"><td class="schedule-date">${esc(formatDate(entry.date))}</td><td class="schedule-time">${esc(entry.time)}</td><td class="schedule-company ${entry.company==='공통'?'common':''}">${esc(entry.company)}</td><td class="schedule-type-cell"><span class="schedule-kind" data-category="${esc(entry.category)}">${esc(entry.category)}</span></td><td class="schedule-detail">${scheduleText}</td><td class="schedule-attendees attendee-groups">${attendees}</td></tr>`}).join(''):'<tr><td class="schedule-empty" colspan="6">조건에 맞는 일정이 없습니다.</td></tr>';
 $('#managerScheduleRows').querySelectorAll('tr[data-entry-index]').forEach(row=>{
  const openDetails=()=>showManagerScheduleDetails(rows[Number(row.dataset.entryIndex)]);
  row.addEventListener('click',openDetails);
  row.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openDetails()}});
 });
}
function setScreen(screen){const showSchedule=screen==='schedule',showManager=screen==='manager',showAgenda=showSchedule||showManager,workspace=$('#mainWorkspace');document.querySelectorAll('.mode-tab').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));workspace.classList.toggle('schedule-mode',showAgenda);$('.sidebar').classList.toggle('hidden',showAgenda);$('.content-head').classList.toggle('hidden',showAgenda);$('#overview').classList.add('hidden');$('#slide').classList.add('hidden');$('#shared').classList.add('hidden');const footer=$('.footer');if(footer)footer.classList.toggle('hidden',showAgenda);$('#scheduleScreen').classList.toggle('hidden',!showSchedule);$('#managerScheduleScreen').classList.toggle('hidden',!showManager);if(showSchedule)renderSchedule();else if(showManager)renderManagerSchedule();else render()}
document.querySelectorAll('.mode-tab').forEach(b=>b.addEventListener('click',()=>{const screen=b.dataset.screen;if(screen==='company'){selected='all'}else if(screen==='schedule'){selectedScheduleCustomer='all';scheduleCustomerFilter.value='all';selectedScheduleDate='all';scheduleDateFilter.value='all';activeScheduleType='모든일정'}else if(screen==='manager'){selectedManager='all';managerFilter.value='all';selectedManagerDate='all';managerDateFilter.value='all';selectedManagerAttendee='all';managerAttendeeFilter.value='all';activeManagerScheduleType='모든일정'}setScreen(screen)}));
function scaleTypography(){const scale=rules=>{for(const rule of rules){if(rule.style){const value=rule.style.getPropertyValue('font-size');if(value)rule.style.setProperty('font-size',value.replace(/(\d+(?:\.\d+)?)(px|vw|rem|em|%)/g,(_,n,u)=>`${Number(n)*1.5}${u}`))}if(rule.cssRules)scale(rule.cssRules)}};for(const sheet of document.styleSheets){try{scale(sheet.cssRules)}catch(_){}}}
function shrinkCustomerScheduleFilter(){for(const element of [document.querySelector('label[for="scheduleCustomerFilter"]'),scheduleCustomerFilter,document.querySelector('label[for="scheduleDateFilter"]'),scheduleDateFilter,document.querySelector('label[for="managerFilter"]'),managerFilter,document.querySelector('label[for="managerDateFilter"]'),managerDateFilter,document.querySelector('label[for="managerAttendeeFilter"]'),managerAttendeeFilter]){if(!element)continue;const current=parseFloat(getComputedStyle(element).fontSize);if(Number.isFinite(current))element.style.fontSize=`${current*0.7}px`}}
scheduleCustomerFilter.addEventListener('change',()=>{selectedScheduleCustomer=scheduleCustomerFilter.value;renderSchedule()});scheduleDateFilter.addEventListener('change',()=>{selectedScheduleDate=scheduleDateFilter.value;renderSchedule()});managerFilter.addEventListener('change',()=>{selectedManager=managerFilter.value;renderManagerSchedule()});managerDateFilter.addEventListener('change',()=>{selectedManagerDate=managerDateFilter.value;renderManagerSchedule()});managerAttendeeFilter.addEventListener('change',()=>{selectedManagerAttendee=managerAttendeeFilter.value;renderManagerSchedule()});
$('#prevBtn').onclick=()=>move(-1);$('#nextBtn').onclick=()=>move(1);function move(dir){const list=matches();if(!list.length)return;if(selected==='all'){choose(dir<0?list[list.length-1].name:list[0].name);return}let i=list.findIndex(c=>c.name===selected);i=(i+dir+list.length)%list.length;choose(list[i].name)}$('#printBtn').onclick=()=>window.print();$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen()});scaleTypography();shrinkCustomerScheduleFilter();init();
const baseScheduleEntries=scheduleEntries;
scheduleEntries=function(){const entries=baseScheduleEntries();return selectedScheduleCustomer==='all'?entries:entries.filter(e=>e.company===selectedScheduleCustomer)};
function showManagerScheduleDetails(entry){
 if(!entry)return;
 const activity=displayActivity(entry,entry.category),place=entry.place&&!activity.includes(entry.place)?entry.place:'',scheduleText=esc(activity)+(place?'('+linkifyPlace(place)+')':''),attendees=formatAttendeeRows(entry.attendees)||'참석자 정보 없음';
 const fields=[['일자',esc(formatDate(entry.date))],['시간',esc(entry.time)],['고객사',esc(entry.company)],['유형',esc(entry.category)],['일정',scheduleText]];
 if(entry.seat)fields.push(['자리',esc(entry.seat)]);
 fields.push(['참석자',attendees]);
 $('#managerScheduleDetailTitle').textContent=`${entry.company} 일정 상세정보`;
 $('#managerScheduleDetailBody').innerHTML=fields.map(([label,value])=>`<div class="manager-detail-row"><span class="manager-detail-label">${label}</span><span class="manager-detail-value ${label==='참석자'?'manager-detail-attendees':''}">${value}</span></div>`).join('');
 $('#managerScheduleDetailModal').classList.remove('hidden');
 $('#managerScheduleDetailClose').focus();
}
function closeManagerScheduleDetails(){$('#managerScheduleDetailModal').classList.add('hidden')}
$('#managerScheduleDetailClose').addEventListener('click',closeManagerScheduleDetails);
$('#managerScheduleDetailModal').addEventListener('click',event=>{if(event.target.id==='managerScheduleDetailModal')closeManagerScheduleDetails()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#managerScheduleDetailModal').classList.contains('hidden'))closeManagerScheduleDetails()});</script>
</body>
</html>
